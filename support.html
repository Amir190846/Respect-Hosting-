<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Respect Hosting - الدعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6', darkBg: '#0f172a', darkCard: '#1e293b' } } } }</script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap'); body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen p-6">
    <a href="index.html" class="text-primary font-bold mb-8 block">← العودة</a>
    <div class="max-w-2xl mx-auto bg-darkCard p-8 rounded-3xl border border-gray-800">
        <h1 class="text-3xl font-black mb-6">الدعم الفني</h1>
        <form onsubmit="event.preventDefault(); alert('تم الإرسال!'); window.location='index.html';" class="space-y-4">
            <input type="text" required placeholder="الاسم" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white">
            <input type="email" required placeholder="الإيميل" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white">
            <textarea required rows="4" placeholder="المشكلة" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white"></textarea>
            <button class="w-full bg-primary text-white font-bold py-4 rounded-xl">إرسال</button>
        </form>
    </div>
</body>
</html>
