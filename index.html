<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respect Hosting - حلول استضافة متقدمة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#3b82f6', darkBg: '#0f172a', darkCard: '#1e293b' } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; top: 0 !important; }
        .animated-bg { background: linear-gradient(-45deg, #0f172a, #1e3a8a, #312e81, #0f172a); background-size: 400% 400%; animation: gradientBG 15s ease infinite; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .drawer-open { transform: translateX(0%); }
        .drawer-closed { transform: translateX(100%); }
        .skiptranslate, #google_translate_element { display: none !important; }
        .goog-te-banner-frame { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <nav class="bg-white/80 dark:bg-darkCard/80 backdrop-blur-md shadow-lg sticky top-0 z-50">
        <div class="container mx-auto p-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="text-white hover:text-primary transition">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <a href="index.html" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-500">RESPECT HOSTING</a>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="openLangModal()" class="text-white hover:text-primary transition">🌐</button>
                <a href="cart.html" class="relative group p-2 text-white hover:text-primary">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    <span id="cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Modal اللغات -->
    <div id="lang-modal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center">
        <div class="bg-darkCard p-8 rounded-3xl w-[90%] max-w-lg">
            <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
                <h2 class="text-2xl font-bold text-white">اختر لغتك</h2>
                <button onclick="closeLangModal()" class="text-red-500 text-2xl">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="setLanguage('ar')" class="p-4 bg-gray-800 hover:bg-primary/20 rounded-xl text-white text-xl">🇮🇶 العربية</button>
                <button onclick="setLanguage('en')" class="p-4 bg-gray-800 hover:bg-primary/20 rounded-xl text-white text-xl">🇺🇸 English</button>
            </div>
        </div>
    </div>

    <div id="side-menu-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/60 z-[60] hidden"></div>
    <div id="side-menu" class="fixed top-0 right-0 h-full w-80 bg-darkCard shadow-2xl z-[70] drawer-closed transition-transform duration-300 overflow-y-auto">
        <div class="p-6 border-b border-gray-800 flex justify-between">
            <h2 class="text-xl font-bold text-primary">القائمة</h2>
            <button onclick="toggleMenu()" class="text-gray-400">✕</button>
        </div>
        <div class="p-4 space-y-4">
            <div>
                <button onclick="toggleOrderMenu()" class="w-full text-right p-3 hover:bg-gray-800 rounded text-white font-bold">الطلب ▼</button>
                <div id="order-submenu" class="hidden flex-col pl-6 space-y-2 mt-2">
                    <button onclick="filterCategory('samp')" class="text-right text-gray-400 hover:text-white">SA-MP</button>
                    <button onclick="filterCategory('mta')" class="text-right text-gray-400 hover:text-white">MTA</button>
                    <button onclick="filterCategory('bot')" class="text-right text-gray-400 hover:text-white">Bots</button>
                    <button onclick="filterCategory('vps')" class="text-right text-gray-400 hover:text-white">VPS</button>
                </div>
            </div>
            <a href="support.html" class="block p-3 hover:bg-gray-800 rounded text-green-400 font-bold">الدعم الفني</a>
            <a href="https://discord.gg/gPTdEZXWRF" class="block p-3 hover:bg-gray-800 rounded text-[#5865F2] font-bold">Discord</a>
        </div>
    </div>

    <header class="animated-bg text-white py-32 text-center shadow-2xl">
        <h1 class="text-6xl font-black mb-4">RESPECT HOSTING</h1>
        <p class="text-xl mb-8">أداء لا يضاهى لخوادمك</p>
        <button onclick="toggleMenu()" class="bg-blue-600 hover:bg-blue-500 py-3 px-8 rounded-full font-bold text-xl">استكشف الخطط</button>
    </header>

    <main id="services" class="container mx-auto px-6 py-16 hidden">
        <h2 class="text-3xl font-bold mb-8 text-white border-b border-gray-700 pb-4">الخطط</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="products-container"></div>
    </main>

    <footer class="bg-darkCard py-8 text-center text-gray-400 relative">
        <p>&copy; 2026 Respect Hosting.</p>
        <a href="admin.html" class="absolute bottom-4 left-4 text-gray-600 hover:text-white">🔒</a>
    </footer>

    <script src="js/app.js"></script>
    <script>
        function openLangModal() { document.getElementById('lang-modal').classList.remove('hidden'); }
        function closeLangModal() { document.getElementById('lang-modal').classList.add('hidden'); }
        function setLanguage(lang) {
            if(lang === 'ar') document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            else document.cookie = `googtrans=/ar/${lang}; path=/`;
            window.location.reload();
        }
    </script>
    <div id="google_translate_element" class="hidden"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'ar'}, 'google_translate_element'); }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
          </html>
