    <script>
        function openLangModal() {
            const modal = document.getElementById('lang-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('lang-modal-content').classList.remove('scale-95'); }, 10);
        }
        function closeLangModal() {
            const modal = document.getElementById('lang-modal');
            modal.classList.add('opacity-0'); document.getElementById('lang-modal-content').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
        function setLanguage(langCode) {
            if(langCode === 'ar') document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + window.location.hostname;
            else document.cookie = `googtrans=/ar/${langCode}; path=/; domain=` + window.location.hostname;
            window.location.reload(); 
        }
    </script>
    <div id="google_translate_element" class="hidden"></div>
