<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Respect Hosting - السلة والدفع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6', darkBg: '#0f172a', darkCard: '#1e293b' } } } }</script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap'); body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-darkCard p-8 rounded-3xl shadow-2xl border border-gray-800">
        <h1 class="text-2xl font-black mb-6 text-center text-primary">Respect Hosting Pay</h1>
        <div class="flex justify-between font-bold text-lg mb-6 border-b border-gray-700 pb-4">
            <span>الإجمالي:</span><span id="cart-total" class="text-primary">$0.00</span>
        </div>
        <form onsubmit="processPayment(event)" class="space-y-4">
            <input type="email" id="email" required placeholder="البريد الإلكتروني" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white">
            <input type="text" required placeholder="اسم حامل البطاقة" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white">
            <input type="text" required placeholder="رقم البطاقة 🔒" maxlength="19" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white font-mono">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" required placeholder="MM/YY" maxlength="5" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white font-mono text-center">
                <input type="password" required placeholder="CVV" maxlength="4" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white font-mono text-center">
            </div>
            <button type="submit" id="pay-btn" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl mt-4">تأكيد الدفع 🔒</button>
        </form>
        <div class="text-center mt-6"><a href="index.html" class="text-sm text-gray-400">العودة للرئيسية</a></div>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem('ecommerce_cart')) || [];
        document.getElementById('cart-total').innerText = '$' + cart.reduce((sum, i) => sum + i.price * i.quantity, 0).toFixed(2);
        function processPayment(e) {
            e.preventDefault();
            if(cart.length === 0) return alert('السلة فارغة!');
            const btn = document.getElementById('pay-btn');
            btn.innerText = 'جاري المعالجة...'; btn.disabled = true;
            setTimeout(() => {
                alert('✅ تم الدفع بنجاح! سيتم إرسال التفاصيل لبريدك.');
                localStorage.removeItem('ecommerce_cart');
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>
