<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respect Hosting - سلة المشتريات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6', darkBg: '#0f172a', darkCard: '#1e293b' } } } }</script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap'); body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-darkCard p-8 rounded-3xl shadow-2xl border border-gray-800">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-black text-white">سلة المشتريات 🛒</h1>
            <a href="index.html" class="text-primary hover:text-blue-400 font-bold">متابعة التسوق ←</a>
        </div>
        
        <!-- هنا تظهر المنتجات -->
        <div id="cart-items" class="space-y-4 mb-8 min-h-[100px]"></div>

        <div class="bg-black/30 p-6 rounded-2xl border border-gray-700">
            <div class="flex justify-between font-bold text-xl mb-6">
                <span>الإجمالي المطلوب:</span>
                <span id="cart-total" class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-500 font-black">$0.00</span>
            </div>
            <!-- زر الانتقال لصفحة الدفع المستقلة -->
            <button onclick="goToCheckout()" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg flex justify-center items-center gap-2">
                <span>متابعة إلى الدفع الآمن</span>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('ecommerce_cart')) || [];
        
        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            
            if(cart.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center text-lg mt-8">سلة المشتريات فارغة</p>';
                totalEl.innerText = '$0.00';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((i, index) => {
                total += i.price * i.quantity;
                return `
                <div class="flex justify-between items-center bg-gray-800/50 p-4 rounded-xl border border-gray-700">
                    <div>
                        <h3 class="font-bold text-white">${i.name}</h3>
                        <p class="text-sm text-gray-400">الكمية: ${i.quantity}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-primary font-bold text-lg">$${(i.price * i.quantity).toFixed(2)}</span>
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-400 p-2 bg-red-500/10 rounded-lg">🗑️</button>
                    </div>
                </div>`;
            }).join('');
            totalEl.innerText = `$${total.toFixed(2)}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('ecommerce_cart', JSON.stringify(cart));
            renderCart();
        }

        function goToCheckout() {
            if(cart.length === 0) {
                alert('السلة فارغة! الرجاء إضافة منتجات أولاً.');
                return;
            }
            // التوجيه لصفحة الدفع الجديدة
            window.location.href = 'checkout.html';
        }

        renderCart();
    </script>
</body>
</html>
