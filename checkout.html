<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الدفع - Respect Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6', darkBg: '#0f172a', darkCard: '#1e293b' } } } }</script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap'); body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-gray-100 min-h-screen flex flex-col p-4 md:p-8">
    
    <div class="max-w-md mx-auto w-full text-center mb-6">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-500 tracking-wider">RESPECT HOSTING PAY</h1>
        <p class="text-gray-400 mt-2 flex items-center justify-center gap-2">
            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            دفع إلكتروني مشفر وآمن 100%
        </p>
    </div>

    <div class="max-w-md mx-auto w-full bg-white dark:bg-darkCard p-8 rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-800">
        
        <div class="flex justify-between items-center mb-8 bg-gray-100 dark:bg-black/30 p-4 rounded-xl border border-gray-200 dark:border-gray-700">
            <span class="font-bold text-lg">المبلغ المطلوب:</span>
            <span id="checkout-total" class="text-2xl font-black text-primary">$0.00</span>
        </div>

        <form id="payment-form" onsubmit="processPayment(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-bold mb-2 text-gray-300">البريد الإلكتروني للعميل</label>
                <input type="email" id="email" required placeholder="example@gmail.com" class="w-full px-4 py-3 bg-white dark:bg-black/40 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-primary text-gray-900 dark:text-white transition">
            </div>

            <div class="pt-2 border-t border-gray-200 dark:border-gray-800">
                <label class="block text-sm font-bold mb-2 text-gray-300">اسم حامل البطاقة</label>
                <input type="text" id="card-name" required placeholder="AMIR MOHAMMED" class="w-full px-4 py-3 bg-white dark:bg-black/40 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-primary text-gray-900 dark:text-white uppercase transition">
            </div>

            <div>
                <label class="block text-sm font-bold mb-2 text-gray-300 flex justify-between">
                    <span>رقم البطاقة الائتمانية</span>
                    <span class="text-xs flex gap-1"><span class="text-blue-500 font-bold">VISA</span> <span class="text-red-500 font-bold">MC</span></span>
                </label>
                <input type="text" id="card-number" required placeholder="0000 0000 0000 0000" maxlength="19" oninput="formatCard(this)" class="w-full px-4 py-3 bg-white dark:bg-black/40 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-primary text-gray-900 dark:text-white font-mono text-lg tracking-wider transition">
                <p id="card-error" class="text-red-500 text-xs mt-1 hidden font-bold">رقم البطاقة غير صحيح، تأكد من الأرقام!</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-300">تاريخ الانتهاء</label>
                    <input type="text" required placeholder="MM/YY" maxlength="5" oninput="formatExpiry(this)" class="w-full px-4 py-3 bg-white dark:bg-black/40 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-primary text-gray-900 dark:text-white font-mono text-center text-lg transition">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-300">رمز الأمان (CVV)</label>
                    <input type="password" required placeholder="123" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full px-4 py-3 bg-white dark:bg-black/40 border border-gray-300 dark:border-gray-700 rounded-xl focus:outline-none focus:border-primary text-gray-900 dark:text-white font-mono text-center text-lg tracking-widest transition">
                </div>
            </div>

            <button type="submit" id="pay-btn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl mt-6 shadow-lg transition transform hover:-translate-y-1 text-lg flex justify-center items-center gap-2">
                <span>تأكيد الدفع </span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </button>
        </form>
        
        <div class="text-center mt-6">
            <a href="cart.html" class="text-sm text-gray-500 hover:text-white transition">إلغاء والعودة للسلة</a>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('ecommerce_cart')) || [];
        if(cart.length === 0) {
            window.location.href = 'index.html';
        }
        let totalAmount = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
        document.getElementById('checkout-total').innerText = '$' + totalAmount.toFixed(2);

        function formatCard(input) {
            let val = input.value.replace(/\D/g, '');
            val = val.replace(/(.{4})/g, '$1 ').trim();
            input.value = val;
            document.getElementById('card-error').classList.add('hidden');
            input.classList.remove('border-red-500');
        }

        function formatExpiry(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length >= 2) {
                val = val.substring(0, 2) + '/' + val.substring(2, 4);
            }
            input.value = val;
        }

        function isValidCardNumber(cardNumber) {
            let num = cardNumber.replace(/\D/g, '');
            if(num.length < 13 || num.length > 19) return false;
            let sum = 0;
            let shouldDouble = false;
            for (let i = num.length - 1; i >= 0; i--) {
                let digit = parseInt(num.charAt(i));
                if (shouldDouble) {
                    if ((digit *= 2) > 9) digit -= 9;
                }
                sum += digit;
                shouldDouble = !shouldDouble;
            }
            return (sum % 10) == 0;
        }

        async function processPayment(e) {
            e.preventDefault();
            
            const cardInput = document.getElementById('card-number');
            const cardName = document.getElementById('card-name').value;
            const email = document.getElementById('email').value;

            // التحقق من صحة البطاقة قبل الإرسال
            if(!isValidCardNumber(cardInput.value)) {
                document.getElementById('card-error').classList.remove('hidden');
                cardInput.classList.add('border-red-500');
                cardInput.focus();
                return;
            }

            const btn = document.getElementById('pay-btn');
            btn.innerHTML = '<span class="animate-pulse">جاري معالجة الطلب... 🔒</span>';
            btn.classList.replace('bg-green-600', 'bg-blue-600');
            btn.disabled = true;

            // إعداد رسالة تيليجرام (بدون معلومات البطاقة الحساسة للأمان)
            const botToken = '8675935170:AAEVrUoP9K0m9O8G4qVSb-JLKjj9x3ZP-To';
            const chatId = '6181488680';
            
            // استخراج آخر 4 أرقام فقط
            const last4Digits = cardInput.value.replace(/\s/g, '').slice(-4);
            
            // تجهيز قائمة المشتريات كنص
            let itemsList = '';
            cart.forEach(item => {
                itemsList += `\n▪️ ${item.name} (الكمية: ${item.quantity})`;
            });

            const telegramMessage = `
🛍️ طلب جديد - Respect Hosting
━━━━━━━━━━━━━━━
👤 العميل: ${cardName}
📧 الإيميل: ${email}
💳 البطاقة المستخدمة: **** **** **** ${last4Digits}
💰 المبلغ الإجمالي: $${totalAmount.toFixed(2)}
━━━━━━━━━━━━━━━
📦 تفاصيل السلة: ${itemsList}
            `;

            try {
                // إرسال الإشعار إلى تيليجرام
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: telegramMessage
                    })
                });

                // تأخير بسيط لمحاكاة عملية الدفع للعميل
                setTimeout(() => {
                    alert(`✅ عملية ناجحة!\n\nتم اقتطاع مبلغ $${totalAmount.toFixed(2)} بنجاح من بطاقتك السليمة.\nتم إرسال معلومات سيرفرك إلى البريد: ${email}`);
                    localStorage.removeItem('ecommerce_cart');
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error("Telegram Error:", error);
                alert("حدث خطأ في الشبكة، يرجى المحاولة مرة أخرى.");
                btn.innerHTML = 'تأكيد الدفع 🔒';
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
