<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Respect Hosting - الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6', darkBg: '#0f172a', darkCard: '#1e293b' } } } }</script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap'); body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-darkCard p-8 rounded-3xl border border-gray-800 text-center">
        <h1 class="text-3xl font-black mb-6">تسجيل دخول الإدارة</h1>
        <form onsubmit="event.preventDefault(); alert('تم الدخول');" class="space-y-4">
            <input type="text" required placeholder="المستخدم" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white">
            <input type="password" required placeholder="المرور" class="w-full px-4 py-3 bg-black/40 border border-gray-700 rounded-xl text-white">
            <button class="w-full bg-primary text-white font-bold py-4 rounded-xl">دخول</button>
        </form>
        <a href="index.html" class="block mt-4 text-gray-500">العودة</a>
    </div>
</body>
</html>
